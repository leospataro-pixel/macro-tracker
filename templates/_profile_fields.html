{# Shared fields for creating / editing a profile. Expects `user`, `avatars`, `activity`. #}
<div class="mb-3">
  <label class="form-label fw-semibold">Nombre</label>
  <input type="text" name="name" class="form-control" value="{{ user.name or '' }}" required maxlength="30">
</div>

<div class="mb-3">
  <label class="form-label fw-semibold">Avatar</label>
  <div>
    {% for a in avatars %}
    <input type="radio" class="btn-check" name="emoji" id="av{{ loop.index }}" value="{{ a }}"
           {{ 'checked' if (user.emoji or avatars[0]) == a }}>
    <label class="btn btn-outline-success mb-1 px-2" for="av{{ loop.index }}" style="font-size:1.3rem">{{ a }}</label>
    {% endfor %}
  </div>
</div>

<div class="row g-2 mb-3">
  <div class="col-6">
    <label class="form-label fw-semibold">Sexo</label>
    <select name="sex" class="form-select">
      <option value="M" {{ 'selected' if user.sex != 'F' }}>Hombre</option>
      <option value="F" {{ 'selected' if user.sex == 'F' }}>Mujer</option>
    </select>
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold">Edad</label>
    <input type="number" name="age" class="form-control" value="{{ user.age|n if user.age }}" min="5" max="110" required>
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold">Altura (cm)</label>
    <input type="number" name="height" class="form-control" value="{{ user.height|n if user.height }}" min="90" max="230" required>
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold">Peso (kg)</label>
    <input type="number" name="weight" class="form-control" value="{{ user.weight|n if user.weight }}" min="20" max="300" step="0.1" required>
  </div>
</div>

<div class="mb-3">
  <label class="form-label fw-semibold">Objetivo</label>
  <div class="row g-2">
    {% for key, gl in GOALS.items() %}
    <div class="col-6">
      <input type="radio" class="btn-check" name="goal" id="goal_{{ key }}" value="{{ key }}"
             {{ 'checked' if (user.goal or 'maintain') == key }}>
      <label class="btn btn-outline-success w-100 py-2" for="goal_{{ key }}">{{ gl.emoji }} {{ gl.label }}</label>
    </div>
    {% endfor %}
  </div>
</div>

<div class="mb-3">
  <label class="form-label fw-semibold">Actividad</label>
  <select name="activity" class="form-select">
    {% for key, (label, factor) in activity.items() %}
    <option value="{{ key }}" {{ 'selected' if (user.activity or 'moderate') == key }}>{{ label }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label class="form-label fw-semibold">Nivel de entrenamiento</label>
  <select name="level" class="form-select">
    {% for key, label in LEVELS.items() %}
    <option value="{{ key }}" {{ 'selected' if (user.level or 'beginner') == key }}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
