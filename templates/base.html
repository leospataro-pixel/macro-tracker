<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#198754">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Calorie Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --green: #198754; }
    body {
      background: #f0f2f5;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
      font-size: 0.95rem;
    }
    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 999;
      box-shadow: 0 -2px 12px rgba(0,0,0,.07);
    }
    .bottom-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 2px 6px;
      text-decoration: none;
      color: #888;
      font-size: 0.65rem;
      font-weight: 500;
      transition: color .15s;
    }
    .bottom-nav a.active { color: var(--green); }
    .bottom-nav a i { font-size: 1.4rem; margin-bottom: 1px; }
    /* ── Cards ── */
    .card { border: none; border-radius: 14px; }
    .progress { height: 9px; border-radius: 9px; }
    /* ── Header ── */
    .page-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1a1a2e;
    }
  </style>
</head>
<body>

<div class="container-fluid px-3 pt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2 small" role="alert">
        {{ msg }}
        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a href="{{ url_for('index') }}"      class="{{ 'active' if request.endpoint == 'index' }}">
    <i class="bi bi-bar-chart-fill"></i>Progreso
  </a>
  <a href="{{ url_for('log_meal') }}"   class="{{ 'active' if request.endpoint == 'log_meal' }}">
    <i class="bi bi-plus-circle-fill"></i>Registrar
  </a>
  <a href="{{ url_for('list_foods') }}" class="{{ 'active' if request.endpoint == 'list_foods' }}">
    <i class="bi bi-database-fill"></i>Alimentos
  </a>
  <a href="{{ url_for('history') }}"    class="{{ 'active' if request.endpoint == 'history' }}">
    <i class="bi bi-calendar3"></i>Historial
  </a>
  <a href="{{ url_for('goals') }}"      class="{{ 'active' if request.endpoint == 'goals' }}">
    <i class="bi bi-sliders"></i>Metas
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
